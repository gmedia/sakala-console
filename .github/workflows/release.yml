name: release

# Production runs immutable images pinned by digest, so a release publishes the
# artifact here once instead of building it on the deployment host.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Publish container image
    runs-on: ubuntu-latest
    # The public browser configuration is baked into the bundle at build time,
    # so the image is environment-specific and must be built with the values of
    # the environment it will serve.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A production tag must describe reviewed code. Without this a tag on an
      # unmerged branch would publish an image nobody reviewed.
      - name: Verify the tag is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME does not point at a commit reachable from main."
            exit 1
          fi

      # The sidebar shows the version from package.json, so a tag whose package.json still carries
      # the previous version would publish an image that misreports itself.
      - name: Verify the tag matches the package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version. Bump it in the release prep commit."
            exit 1
          fi

      # Written to a file because the Dockerfile consumes it as a BuildKit
      # secret, exactly like the deployment host does for staging. Every value
      # in it is public by design; the Reverb app secret is never among them.
      - name: Materialise the public build environment
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          if [ -z "$FRONTEND_ENV" ]; then
            echo "The production environment must define the FRONTEND_ENV secret."
            exit 1
          fi
          umask 077
          printf '%s\n' "$FRONTEND_ENV" > frontend.env
          echo "FRONTEND_ENV_SHA=$(sha256sum frontend.env | awk '{ print $1 }')" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3

      - name: Log in to the registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          push: true
          secret-files: frontend_env=frontend.env
          build-args: FRONTEND_ENV_SHA=${{ env.FRONTEND_ENV_SHA }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sakala-console:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            dev.sakala.console.env-sha=${{ env.FRONTEND_ENV_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Remove the build environment file
        if: always()
        run: rm -f frontend.env

  github-release:
    name: Publish GitHub Release
    # Runs only after the image is published, so a Release never announces a
    # version whose image does not exist. The image job also refuses tags that
    # are not reachable from main. Only this job may write to the repository.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The notes are this version's CHANGELOG section: everything between
      # "## [X.Y.Z]" and the next "## [" heading. A version tag without one is a
      # release prep mistake, so the job fails instead of publishing a Release
      # with only the generated list.
      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, heading) == 1); next }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error file=CHANGELOG.md::No non-empty \"## [$version]\" section in CHANGELOG.md for tag $GITHUB_REF_NAME."
            exit 1
          fi
          cat "$notes"

      # GitHub appends its generated "What's Changed" list, which mentions every
      # contributor, below the changelog section.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          # A tag such as v1.0.0-rc.1 is a prerelease and never becomes Latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
