name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser only, no --with-deps: GitHub's Ubuntu images already ship the
      # system libraries Chromium needs (they include Google Chrome), and
      # --with-deps runs apt, which failed on every run on 2026-11-11 when the
      # runners could not resolve the Ubuntu mirrors.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check generated API types
        run: pnpm api:types:check

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit and component tests
        run: pnpm test

      - name: Build static SPA
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm test:e2e
