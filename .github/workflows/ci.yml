name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and Test
    # Pinned: on 2026-11-11 the ubuntu-latest image moved to 26.04, whose
    # runners could not resolve the Ubuntu apt mirrors, so "Install Chromium"
    # (playwright --with-deps) failed on every run. Move to a newer image on
    # purpose once it installs cleanly.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Run unit and component tests
        run: pnpm test

      - name: Build static SPA
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm test:e2e
