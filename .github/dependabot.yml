# Dependabot keeps dependencies current. Security updates are separate (enabled
# in repository settings) and skip the cooldown; version updates below wait 7
# days after a release so a hijacked package is usually caught before it lands.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    ignore:
      # @types/node follows the Node runtime major (node:22 in the Dockerfile,
      # engines >=22.12), not the newest Node; bump it by hand with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Jakarta'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'docker'
    directory: '/'
    ignore:
      # Odd Node majors are not LTS; move to the next LTS by hand.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Jakarta'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      docker-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Jakarta'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions-minor-patch:
        update-types: ['minor', 'patch']
